<app-menu></app-menu>
<h1>Dashboard FORD</h1><hr>
<div class="info-squares">
    <div class="info-square">
        <h3>Veículo</h3>
        <select>
            <option>Mustang</option>
            <option>Territory</option>
            <option>Ranger</option>
            <option>Bronco Sport</option>
        </select>
    </div>
    <div class="info-square">
        <h3>Total de vendas</h3>
        <label id="total-sales">[placeholder]</label>
        <p>Unid.</p>
    </div>
    <div class="info-square">
        <h3>Conectados</h3>
        <label id="connected">[placeholder]</label>
        <p>Unid.</p>
    </div>
    <div class="info-square">
        <h3>Update de Software</h3>
        <label id="software-update">[placeholder]</label>
        <p>Unid.</p>
    </div>
</div>
<div class="car-image">
    <img src="img/mustang.png">
</div>

<table class="dashboard-table">
    <thead>
        <tr>
            <th>Código Vin</th>
            <th>Odômetro</th>
            <th>Nível de Combustível</th>
            <th>Status</th>
            <th>Lat</th>
            <th>Long</th>
        </tr>
    </thead>
    <tbody id="table-body">
        <tr>
            <td><input type="text" placeholder="Buscar..."></td>
            <td id="odometer">[placeholder]</td>
            <td id="fuel">[placeholder]</td>
            <td id="status">[placeholder]</td>
            <td id="lat">[placeholder]</td>
            <td id="long">[placeholder]</td>
        </tr>
    </tbody>
</table>
