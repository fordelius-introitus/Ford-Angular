<app-menu></app-menu>
<h1>Dashboard FORD</h1><hr>
<div class="info-squares">
    <div class="info-square">
        <h3>Veículo</h3>
        <select>
            <option>Mustang</option>
            <option>Territory</option>
            <option>Ranger</option>
            <option>Bronco Sport</option>
        </select>
    </div>
    <div class="info-square">
        <h3>Total de vendas</h3>
        <label id="total-sales">[placeholder]</label>
        <p>Unid.</p>
    </div>
    <div class="info-square">
        <h3>Conectados</h3>
        <label id="connected">[placeholder]</label>
        <p>Unid.</p>
    </div>
    <div class="info-square">
        <h3>Update de Software</h3>
        <label id="software-update">[placeholder]</label>
        <p>Unid.</p>
    </div>
</div>
<figure class="car-image">
    <img src="">
</figure>
<table class="specs-table">
    <tr>
        <th>Código - Vin</th>
        <th>Odômetro</th>
        <th>Nível de Combustível</th>
        <th>Status</th>
        <th>Lat.</th>
        <th>Long.</th>
    </tr>
    <tr>
        <td><input type="text" id="vin-code" placeholder="Código Vin"></td>
        <td><label id="odometer">[placeholder]</label></td>
        <td><label id="fuel">[placeholder]</label></td>
        <td><label id="status">[placeholder]</label></td>
        <td><label id="lat">[placeholder]</label></td>
        <td><label id="long">[placeholder]</label></td>
    </tr>
</table>
<div class="bottom-blue"></div>
